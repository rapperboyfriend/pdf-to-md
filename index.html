<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 마크다운 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#141A23; --muted:#5A6576;
  --line:#D6DCE5; --line-strong:#B6C0CE; --accent:#2E49D1; --accent-ink:#FFFFFF; --accent-soft:#E4E9FF;
  --ok:#1C7F54; --ok-soft:#DDF3E8; --warn:#8A5A00; --warn-soft:#FFF1D6; --err:#B8322F; --err-soft:#FBE3E2;
  --code-bg:#F2F4F8; --shadow:0 1px 2px rgba(20,26,35,.06),0 10px 30px -16px rgba(20,26,35,.22);
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#151B23; --surface-2:#1A212B; --ink:#E3E8EF; --muted:#8F9BAD;
    --line:#28313D; --line-strong:#3A4555; --accent:#8C9EFF; --accent-ink:#0D1117; --accent-soft:#1F2748;
    --ok:#52C890; --ok-soft:#14301F; --warn:#F2B64C; --warn-soft:#33270F; --err:#FF7F7A; --err-soft:#3A1918;
    --code-bg:#10151C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151B23; --surface-2:#1A212B; --ink:#E3E8EF; --muted:#8F9BAD;
  --line:#28313D; --line-strong:#3A4555; --accent:#8C9EFF; --accent-ink:#0D1117; --accent-soft:#1F2748;
  --ok:#52C890; --ok-soft:#14301F; --warn:#F2B64C; --warn-soft:#33270F; --err:#FF7F7A; --err-soft:#3A1918;
  --code-bg:#10151C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:clamp(16px,3vw,32px);margin:0}
.app{max-width:1320px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{flex:none;width:42px;height:42px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:-.04em;white-space:nowrap}
.mark b{color:var(--accent);font-weight:500}
:root[data-theme="dark"] .mark b{color:var(--accent-ink)}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.privacy{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface)}
.privacy i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* layout */
.layout{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.label button{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;border-radius:4px}

/* drop zone */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 18px 26px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.over{transform:scale(1.01)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop strong{font-size:15.5px;font-weight:600}
.drop span{color:var(--muted);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* options */
.opts{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;border:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--surface)}
.opt input{grid-row:span 2;margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.opt b{font-weight:500;font-size:13.5px}
.opt small{color:var(--muted);font-size:12px;line-height:1.45}

/* file list */
.files{display:flex;flex-direction:column;gap:6px}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer}
.file:hover{background:var(--surface)}
.file[aria-current="true"]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
.ficon{width:28px;height:34px;border-radius:4px;border:1.5px solid var(--line-strong);position:relative;font-family:var(--mono);font-size:8.5px;display:grid;place-items:end center;padding-bottom:4px;color:var(--muted)}
.ficon::before{content:"";position:absolute;top:-1.5px;right:-1.5px;width:9px;height:9px;background:var(--bg);border-left:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);border-bottom-left-radius:3px}
.fname{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.working,.chip.queued{background:var(--accent-soft);color:var(--accent)}
.chip.error{background:var(--err-soft);color:var(--err)}
.chip.sample{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0;padding:12px 2px 0;border-top:1px solid var(--line)}

/* output */
.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.doc{min-width:0;display:flex;flex-direction:column;gap:2px}
.doc-name{display:flex;align-items:center;gap:8px;min-width:0}
.doc-name strong{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}
.banner{margin:0;padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.banner.sample{background:var(--warn-soft);color:var(--warn)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err)}

.panes{display:grid;grid-template-columns:1fr 1fr;height:min(74vh,860px);min-height:420px;position:relative}
.panes[data-view="md"],.panes[data-view="preview"]{grid-template-columns:1fr}
.panes[data-view="md"] .pv,.panes[data-view="preview"] .src{display:none}
@media (max-width:700px){.panes[data-view="split"]{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.pane-h{position:sticky;top:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 16px;background:inherit;border-bottom:1px solid var(--line);z-index:1}
.src{display:flex;flex-direction:column;min-height:0;background:var(--code-bg);border-right:1px solid var(--line)}
@media (max-width:700px){.panes[data-view="split"] .src{border-right:0;border-bottom:1px solid var(--line)}}
.panes[data-view="md"] .src{border-right:0}
textarea{flex:1;min-height:0;width:100%;resize:none;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.7;padding:14px 16px;tab-size:2}
textarea:focus{outline:none}
.pv{overflow:auto;min-height:0;background:var(--surface)}
.md{padding:18px 24px 40px;max-width:72ch;font-size:14.5px;line-height:1.75;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;text-wrap:balance;margin:1.5em 0 .5em;font-weight:700}
.md h1{font-size:1.6em}.md h2{font-size:1.3em;padding-bottom:.3em;border-bottom:1px solid var(--line)}.md h3{font-size:1.1em}.md h4{font-size:1em;color:var(--muted)}
.md p{margin:.7em 0}
.md ul,.md ol{padding-left:1.4em;margin:.6em 0}
.md li{margin:.2em 0}
.md hr{border:0;border-top:1px dashed var(--line-strong);margin:2em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
.md blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--line-strong);color:var(--muted)}
.md .tbl{overflow-x:auto;margin:1em 0}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:600}
.md a{color:var(--accent)}

.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);z-index:2}
.busy div{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.busy .bar{width:220px;height:4px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">P<b>→</b>#</div>
      <div>
        <h1>PDF 마크다운 변환기</h1>
        <p class="sub">PDF를 올리면 제목·목록·표 구조를 살려 Markdown(.md)으로 바꿔 드려요.</p>
      </div>
    </div>
    <span class="privacy"><i></i>파일은 서버로 올라가지 않고 이 브라우저 안에서만 변환돼요</span>
  </header>

  <div class="layout">
    <aside class="side">
      <label class="drop" id="drop">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v18M13 17l7 7 7-7"/><path d="M6 26v5a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-5"/></svg>
        <strong>PDF를 여기에 끌어다 놓으세요</strong>
        <span>또는 클릭해서 선택 · 여러 개도 한 번에</span>
        <input class="sr" id="file-input" type="file" accept="application/pdf,.pdf" multiple>
      </label>

      <section>
        <h2 class="label">변환 옵션</h2>
        <fieldset class="opts" id="opts">
          <label class="opt"><input type="checkbox" id="opt-headers" checked><b>머리글·바닥글 빼기</b><small>매 쪽 반복되는 문구와 쪽 번호를 지워요</small></label>
          <label class="opt"><input type="checkbox" id="opt-bold" checked><b>굵은 글씨 유지</b><small>굵은 글꼴을 **굵게**로 옮겨요 (조금 느려져요)</small></label>
          <label class="opt"><input type="checkbox" id="opt-tables" checked><b>표 인식</b><small>칸이 나뉜 줄을 Markdown 표로 바꿔요</small></label>
          <label class="opt"><input type="checkbox" id="opt-columns" checked><b>2단 편집 인식</b><small>논문처럼 두 단으로 나뉜 쪽을 왼쪽 단부터 읽어요</small></label>
          <label class="opt"><input type="checkbox" id="opt-pages"><b>쪽마다 구분선</b><small>쪽이 바뀌는 곳에 --- 를 넣어요</small></label>
        </fieldset>
      </section>

      <section>
        <h2 class="label"><span>파일</span><button type="button" id="clear" hidden>모두 지우기</button></h2>
        <div class="files" id="files"></div>
        <p class="note">텍스트만 옮기며, 이미지·수식은 제외돼요. 스캔한 PDF는 글자 정보가 없어 OCR을 먼저 거쳐야 해요.</p>
      </section>
    </aside>

    <main class="out">
      <div class="bar-top">
        <div class="doc">
          <div class="doc-name"><strong id="doc-name">예시 보고서.pdf</strong><span class="chip sample" id="doc-chip">예시</span></div>
          <span class="stats" id="stats"></span>
        </div>
        <div class="tools">
          <div class="seg" role="group" aria-label="보기 방식">
            <button type="button" data-view="split" aria-pressed="true">나란히</button>
            <button type="button" data-view="md" aria-pressed="false">Markdown</button>
            <button type="button" data-view="preview" aria-pressed="false">미리보기</button>
          </div>
          <button type="button" class="btn" id="copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>복사</button>
          <button type="button" class="btn primary" id="save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>.md 저장</button>
        </div>
      </div>
      <p class="banner sample" id="banner">아래는 예시 결과예요. PDF를 올리면 이 자리에 변환 결과가 나타나요.</p>
      <div class="panes" id="panes" data-view="split">
        <div class="src">
          <div class="pane-h">Markdown · 직접 고칠 수 있어요</div>
          <textarea id="md-src" spellcheck="false" aria-label="Markdown 원문"></textarea>
        </div>
        <div class="pv">
          <div class="pane-h">미리보기</div>
          <div class="md" id="preview"></div>
        </div>
        <div class="busy" id="busy" hidden><div><span class="spin"></span><span id="busy-text">변환 중…</span><span class="bar"><i id="busy-bar"></i></span></div></div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(() => {
const PDFJS_VER = '3.11.174';
const $ = s => document.querySelector(s);
const E = {
  drop: $('#drop'), input: $('#file-input'), files: $('#files'), clear: $('#clear'),
  name: $('#doc-name'), chip: $('#doc-chip'), stats: $('#stats'), banner: $('#banner'),
  panes: $('#panes'), src: $('#md-src'), preview: $('#preview'),
  busy: $('#busy'), busyText: $('#busy-text'), busyBar: $('#busy-bar'),
  copy: $('#copy'), save: $('#save'), toast: $('#toast')
};

const SAMPLE_MD = `# 2026년 3분기 서비스 운영 보고서

## 1. 개요

이 보고서는 7월부터 9월까지의 서비스 이용 현황과 주요 개선 사항을 정리한 것입니다. **월간 활성 사용자**는 전 분기보다 18% 늘었습니다.

## 2. 주요 지표

| 항목 | 7월 | 8월 | 9월 |
| --- | --- | --- | --- |
| 월간 활성 사용자 | 41,200 | 44,850 | 48,630 |
| 평균 이용 시간 | 6분 12초 | 6분 40초 | 7분 05초 |
| 결제 전환율 | 3.1% | 3.4% | 3.9% |

## 3. 개선 사항

- 검색 응답 속도 개선 (평균 320ms → 140ms)
- 모바일 결제 화면 단순화
    - 입력 단계 5단계 → 3단계
- 고객센터 챗봇 도입

### 3.1 다음 분기 계획

1. 알림 설정 세분화
2. 다크 모드 지원
`;

const sample = { id: 'sample', name: '예시 보고서.pdf', status: 'done', md: SAMPLE_MD, pages: 3, sample: true };
let files = [];
let activeId = 'sample';
let seq = 0;
let busy = false;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------------- PDF → Markdown ---------------- */

const opts = () => ({
  headers: $('#opt-headers').checked, bold: $('#opt-bold').checked, tables: $('#opt-tables').checked,
  columns: $('#opt-columns').checked, pageBreaks: $('#opt-pages').checked
});

const BOLD_RE = /bold|black|heavy|semibold|demibold|extrabold|ultrabold/i;
const BOLD_SUFFIX = /[-,](B|Bd|SB|EB|XB|H|Hv)$/;
const BULLET = /^(?:[•●○◦▪▫■□◆◇▶▷►‣⁃∙·✓✔➢➤]\s*|[-*–—]\s+)/;
const ORDERED = /^(\d{1,3})[.)]\s+/;
const ITEM_START = /^(\(?\d{1,3}\)|[①-⑳]|[가-하][.)]\s|\([가-하]\)|※|[a-z][.)]\s|[IVX]{1,4}\.\s)/;
const CJK = /[぀-ヿ㐀-鿿豈-﫿]/;
const TERMINAL = /[.!?:;。！？]["'”’)\]]?$/;

const esc = t => t.replace(/([\\`*])/g, '\\$1');

async function convertPdf(buf, o, onProgress) {
  if (typeof pdfjsLib === 'undefined') throw new Error('변환 엔진(pdf.js)을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
  const task = pdfjsLib.getDocument({
    data: new Uint8Array(buf.slice(0)), isEvalSupported: false, disableFontFace: true, useSystemFonts: true,
    cMapUrl: `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}/cmaps/`, cMapPacked: true
  });
  const pdf = await task.promise;
  const total = pdf.numPages;
  const pages = [];
  try {
    for (let n = 1; n <= total; n++) {
      const page = await pdf.getPage(n);
      pages.push(await readPage(page, n, o));
      page.cleanup();
      onProgress(n, total);
      await new Promise(r => setTimeout(r, 0));
    }
  } finally { pdf.destroy(); }
  const chars = pages.reduce((s, p) => s + p.chars, 0);
  const md = toMarkdown(pages, o);
  const warning = chars < total * 20
    ? '글자를 거의 찾지 못했어요. 스캔한 이미지로 된 PDF라면 OCR로 글자를 먼저 인식시켜야 해요.' : null;
  return { md, pages: total, warning };
}

async function readPage(page, n, o) {
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  if (o.bold) { try { await page.getOperatorList(); } catch {} }
  const boldCache = new Map();
  const isBold = fn => {
    if (boldCache.has(fn)) return boldCache.get(fn);
    let name = '', b = false;
    try {
      const f = page.commonObjs.has(fn) ? page.commonObjs.get(fn) : null;
      if (f) { name = f.name || ''; b = !!(f.bold || f.black); }
    } catch {}
    b = b || BOLD_RE.test(name) || BOLD_SUFFIX.test(name.trim()) || BOLD_RE.test(tc.styles[fn]?.fontFamily || '');
    boldCache.set(fn, b);
    return b;
  };

  const items = [];
  let chars = 0;
  for (const it of tc.items) {
    if (typeof it.str !== 'string' || !it.str) continue;
    const t = it.transform;
    const size = Math.hypot(t[2], t[3]) || Math.abs(it.height) || 10;
    const [x, y] = vp.convertToViewportPoint(t[4], t[5]);
    const str = it.str.replace(/[­​﻿]/g, '').replace(/\s+/g, ' ');
    const space = !str.trim();
    if (!space) chars += str.trim().length;
    items.push({ str, x, y, w: it.width || 0, size, space, bold: !space && o.bold && isBold(it.fontName) });
  }

  let groups = [items];
  if (o.columns) {
    const cut = findGutter(items, vp.width);
    if (cut != null) {
      const L = [], R = [];
      for (const it of items) (it.x < cut ? L : R).push(it);
      groups = [L, R];
    }
  }
  const lines = [];
  groups.forEach((g, col) => groupLines(g).forEach(l => { l.col = col; l.page = n; lines.push(l); }));
  return { n, lines, chars, height: vp.height };
}

function findGutter(items, W) {
  const real = items.filter(i => !i.space && i.w > 0);
  if (real.length < 20) return null;
  const B = 2, nb = Math.ceil(W / B) + 2, cov = new Uint16Array(nb);
  for (const it of real) {
    const a = Math.max(0, Math.floor(it.x / B)), b = Math.min(nb - 1, Math.ceil((it.x + it.w) / B));
    for (let k = a; k < b; k++) cov[k]++;
  }
  const thr = Math.max(2, Math.round(real.length * 0.03));
  const lo = Math.floor(W * 0.3 / B), hi = Math.min(nb - 1, Math.ceil(W * 0.7 / B));
  let best = null, start = -1;
  for (let k = lo; k <= hi + 1; k++) {
    const free = k <= hi && cov[k] <= thr;
    if (free && start < 0) start = k;
    if (!free && start >= 0) { const len = k - start; if (!best || len > best.len) best = { len, start }; start = -1; }
  }
  if (!best || best.len * B < 8) return null;
  const cut = (best.start + best.len / 2) * B;
  const L = real.filter(i => i.x + i.w <= cut), R = real.filter(i => i.x >= cut);
  if (L.length < real.length * 0.2 || R.length < real.length * 0.2) return null;
  const span = a => { let mn = Infinity, mx = -Infinity; for (const i of a) { mn = Math.min(mn, i.y); mx = Math.max(mx, i.y); } return mx - mn; };
  const all = span(real);
  if (span(L) < all * 0.35 || span(R) < all * 0.35) return null;
  return cut;
}

function groupLines(items) {
  const sorted = items.slice().sort((a, b) => a.y - b.y || a.x - b.x);
  const raw = [];
  for (const it of sorted) {
    const L = raw[raw.length - 1];
    if (L && Math.abs(it.y - L.y) <= Math.max(1.5, Math.min(it.size, L.size) * 0.4)) L.items.push(it);
    else raw.push({ y: it.y, size: it.size, items: [it] });
  }
  return raw.map(buildLine).filter(l => l.text);
}

function pushRun(seg, t, b) {
  const last = seg.runs[seg.runs.length - 1];
  if (t === ' ') { if (last && !/\s$/.test(last.t)) last.t += ' '; return; }
  if (last && /\s$/.test(last.t)) t = t.replace(/^ +/, '');
  if (last && last.b === b) last.t += t; else seg.runs.push({ t, b });
}

function buildLine(L) {
  const its = L.items.sort((a, b) => a.x - b.x);
  let wsum = 0, ssum = 0;
  for (const it of its) if (!it.space) { wsum += it.str.length; ssum += it.size * it.str.length; }
  const size = wsum ? ssum / wsum : (its[0]?.size || 10);
  const segs = [];
  let seg = null, end = null, pend = false, prev = null;
  for (const it of its) {
    if (it.space) { pend = true; continue; }
    // 가짜 굵게(같은 글자를 겹쳐 찍기) 제거
    if (prev && it.str === prev.str && Math.abs(it.x - prev.x) < size * 0.3) { continue; }
    const gap = end == null ? 0 : it.x - end;
    if (!seg || gap > size * 1.3) { seg = { x0: it.x, x1: it.x, runs: [] }; segs.push(seg); }
    else if (pend || gap > size * 0.22) pushRun(seg, ' ', it.bold);
    pushRun(seg, it.str, it.bold);
    seg.x1 = Math.max(seg.x1, it.x + it.w);
    end = Math.max(end ?? -Infinity, it.x + it.w);
    pend = false; prev = it;
  }
  for (const s of segs) {
    s.runs = s.runs.filter(r => r.t);
    if (s.runs.length) { s.runs[0].t = s.runs[0].t.replace(/^\s+/, ''); const z = s.runs[s.runs.length - 1]; z.t = z.t.replace(/\s+$/, ''); }
    s.runs = s.runs.filter(r => r.t);
  }
  const live = segs.filter(s => s.runs.length);
  const text = live.map(s => s.runs.map(r => r.t).join('')).join(' ').trim();
  const allBold = live.length > 0 && live.every(s => s.runs.every(r => r.b || !r.t.trim()));
  return { y: L.y, size, x0: live[0]?.x0 ?? 0, x1: live.length ? live[live.length - 1].x1 : 0, segs: live, text, allBold };
}

function runsToMd(runs, suppressBold) {
  let out = '';
  for (const r of runs) {
    const t = esc(r.t);
    if (r.b && !suppressBold && t.trim()) {
      const m = t.match(/^(\s*)([\s\S]*?)(\s*)$/);
      out += m[1] + '**' + m[2] + '**' + m[3];
    } else out += t;
  }
  return out.replace(/\*\*(\s*)\*\*/g, '$1');
}

function toMarkdown(pages, o) {
  /* 머리글·바닥글 */
  if (o.headers) {
    const key = l => l.text.replace(/\d+/g, '#').replace(/\s+/g, ' ').trim().toLowerCase();
    const pageNum = /^[-–—\s]*(p(age)?\.?\s*)?\d{1,4}(\s*(\/|of|-)\s*\d{1,4})?(\s*쪽)?[-–—\s]*$|^[-–—\s]*[ivxlc]{1,6}[-–—\s]*$/i;
    const edges = p => {
      const byY = p.lines.slice().sort((a, b) => a.y - b.y);
      return new Set([...byY.slice(0, 2).filter(l => l.y < p.height * 0.15), ...byY.slice(-2).filter(l => l.y > p.height * 0.85)]);
    };
    const edgeSets = pages.map(edges);
    const counts = new Map();
    if (pages.length >= 2) edgeSets.forEach(set => {
      const seen = new Set();
      for (const l of set) { const k = key(l); if (k && !seen.has(k)) { seen.add(k); counts.set(k, (counts.get(k) || 0) + 1); } }
    });
    const lim = Math.max(2, Math.ceil(pages.length * 0.5));
    pages.forEach((p, i) => {
      const set = edgeSets[i];
      p.lines = p.lines.filter(l => !(set.has(l) && (pageNum.test(l.text) || (counts.get(key(l)) || 0) >= lim)));
    });
  }

  /* 본문 글자 크기 · 제목 단계 */
  const all = pages.flatMap(p => p.lines);
  const hist = new Map();
  for (const l of all) { const s = Math.round(l.size * 2) / 2; hist.set(s, (hist.get(s) || 0) + l.text.length); }
  let body = 10, bestC = -1;
  for (const [s, c] of hist) if (c > bestC) { bestC = c; body = s; }
  const total = all.reduce((s, l) => s + l.text.length, 0) || 1;
  const cand = [...hist.entries()].filter(([s, c]) => s >= body * 1.15 && c <= total * 0.25).map(([s]) => s).sort((a, b) => b - a);
  const levels = [];
  for (const s of cand) if (!levels.length || levels[levels.length - 1] - s > 0.9) levels.push(s);
  levels.splice(4);
  const headingLevel = size => {
    if (size < body * 1.15 || !levels.length) return 0;
    let best = 0, bd = Infinity;
    levels.forEach((s, i) => { const d = Math.abs(size - s); if (d < bd) { bd = d; best = i + 1; } });
    return best;
  };

  /* 줄 간격 */
  const diffs = [];
  for (const p of pages) for (let i = 1; i < p.lines.length; i++) {
    const a = p.lines[i - 1], b = p.lines[i], d = b.y - a.y;
    if (a.col === b.col && Math.abs(a.size - body) < 0.8 && Math.abs(b.size - body) < 0.8 && d > body * 0.8 && d < body * 3) diffs.push(d);
  }
  diffs.sort((a, b) => a - b);
  const lineGap = diffs.length ? diffs[Math.floor(diffs.length * 0.4)] : body * 1.4;

  const lineMd = (l, skip = 0) => {
    const parts = [];
    for (const s of l.segs) {
      let runs = s.runs;
      if (skip > 0) {
        runs = [];
        for (const r of s.runs) {
          if (skip >= r.t.length) { skip -= r.t.length; continue; }
          runs.push({ t: r.t.slice(skip), b: r.b }); skip = 0;
        }
        if (skip > 0) skip--; // 칸 사이 공백
      }
      parts.push(runsToMd(runs, !o.bold || l.allBold));
    }
    return parts.filter(Boolean).join(' ').trim();
  };

  const joinText = (a, b) => {
    if (/[A-Za-z]-$/.test(a) && /^[a-z]/.test(b)) return a.slice(0, -1) + b;
    if (CJK.test(a.slice(-1)) && CJK.test(b[0])) return a + b;
    return a + ' ' + b;
  };

  const canJoin = (cur, l) => {
    const prev = cur.last;
    if (Math.abs(l.size - cur.size) > Math.max(0.8, cur.size * 0.1)) return false;
    if ((o.bold && l.allBold) !== cur.bold) return false;
    if (prev.page === l.page && prev.col === l.col) {
      const d = l.y - prev.y;
      if (!(d > 0 && d <= lineGap * (l.size / body) * 1.45)) return false;
      if (cur.type === 'li') return l.x0 > cur.x0 + l.size * 0.4;
      if (TERMINAL.test(prev.text) || /[다요]$/.test(prev.text)) {
        if (l.x0 - cur.minX > l.size * 1.2) return false;          // 들여쓰기로 새 문단
        if (cur.n > 1 && prev.x1 < cur.maxX1 - l.size * 4) return false; // 짧게 끝난 줄
      }
      return true;
    }
    const next = (l.page === prev.page && l.col > prev.col) || l.page === prev.page + 1;
    return next && !o.pageBreaks && !TERMINAL.test(prev.text);
  };

  const blocks = [];
  let cur = null;
  const flush = () => { if (cur) { blocks.push(cur); cur = null; } };

  pages.forEach((p, pi) => {
    if (pi > 0 && o.pageBreaks) { flush(); blocks.push({ type: 'hr' }); }
    const tables = o.tables ? detectTables(p.lines, r => runsToMd(r, !o.bold)) : [];
    let ti = 0;
    for (let i = 0; i < p.lines.length; i++) {
      if (ti < tables.length && i === tables[ti].start) {
        flush(); blocks.push({ type: 'table', md: tables[ti].md }); i = tables[ti].end; ti++; continue;
      }
      const l = p.lines[i];
      const lvl = l.text.length <= 150 ? headingLevel(l.size) : 0;
      if (lvl) {
        const prev = cur && cur.last;
        if (cur && cur.type === 'h' && cur.level === lvl && prev.page === l.page && prev.col === l.col && l.y - prev.y > 0 && l.y - prev.y <= l.size * 1.8) {
          cur.text += ' ' + esc(l.text); cur.last = l; continue;
        }
        flush(); cur = { type: 'h', level: lvl, text: esc(l.text), last: l }; continue;
      }
      const bm = l.text.match(BULLET), om = !bm && l.text.match(ORDERED);
      if (bm || om) {
        flush();
        cur = { type: 'li', marker: om ? om[1] + '.' : '-', text: lineMd(l, (bm || om)[0].length), x0: l.x0, size: l.size, last: l, bold: o.bold && l.allBold, n: 1, minX: l.x0, maxX1: l.x1 };
        continue;
      }
      if (cur && (cur.type === 'p' || cur.type === 'li') && !ITEM_START.test(l.text) && canJoin(cur, l)) {
        cur.text = joinText(cur.text, lineMd(l)); cur.last = l; cur.n++;
        cur.minX = Math.min(cur.minX, l.x0); cur.maxX1 = Math.max(cur.maxX1, l.x1);
        continue;
      }
      flush();
      cur = { type: 'p', text: lineMd(l), x0: l.x0, minX: l.x0, maxX1: l.x1, size: l.size, last: l, bold: o.bold && l.allBold, n: 1 };
    }
  });
  flush();

  /* 출력 */
  const subLevel = Math.min(levels.length + 1, 4);
  const out = [];
  let listMin = null;
  blocks.forEach((b, i) => {
    const prev = blocks[i - 1];
    let s;
    if (b.type === 'h') s = '#'.repeat(b.level) + ' ' + b.text;
    else if (b.type === 'hr') s = '---';
    else if (b.type === 'table') s = b.md;
    else if (b.type === 'li') {
      if (!prev || prev.type !== 'li') {
        listMin = Infinity;
        for (let j = i; j < blocks.length && blocks[j].type === 'li'; j++) listMin = Math.min(listMin, blocks[j].x0);
      }
      const lv = Math.max(0, Math.min(3, Math.round((b.x0 - listMin) / (b.size * 1.2))));
      const t = b.bold && b.text ? `**${b.text}**` : b.text;
      s = ' '.repeat(lv * 4) + b.marker + ' ' + t;
    } else {
      if (b.bold && b.n === 1 && b.text.length <= 60 && !TERMINAL.test(b.text)) s = '#'.repeat(subLevel) + ' ' + b.text;
      else s = (b.bold ? `**${b.text}**` : b.text).replace(/^([#>+])/, '\\$1');
    }
    if (!s.trim()) return;
    out.push((out.length ? (b.type === 'li' && prev && prev.type === 'li' ? '\n' : '\n\n') : '') + s);
  });
  return out.join('').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function detectTables(lines, cellMd) {
  const res = [];
  let i = 0;
  while (i < lines.length) {
    if (lines[i].segs.length < 2) { i++; continue; }
    let j = i;
    while (j + 1 < lines.length && lines[j + 1].segs.length >= 2 && lines[j + 1].col === lines[j].col) {
      const d = lines[j + 1].y - lines[j].y;
      if (!(d > 0 && d < lines[j].size * 3.2)) break;
      j++;
    }
    const rows = lines.slice(i, j + 1);
    const maxSeg = Math.max(...rows.map(r => r.segs.length));
    if (rows.length >= 3 || (rows.length >= 2 && maxSeg >= 3)) {
      const md = buildTable(rows, cellMd);
      if (md) res.push({ start: i, end: j, md });
    }
    i = j + 1;
  }
  return res;
}

function buildTable(rows, cellMd) {
  const tol = rows[0].size * 1.5;
  const xs = rows.flatMap(r => r.segs.map(s => s.x0)).sort((a, b) => a - b);
  const anchors = [];
  for (const x of xs) {
    const a = anchors[anchors.length - 1];
    if (a && x - a.max <= tol) a.max = x; else anchors.push({ min: x, max: x });
  }
  if (anchors.length < 2 || anchors.length > 12) return null;
  const cols = anchors.map(a => a.min);
  const grid = rows.map(r => {
    const cells = Array(cols.length).fill('');
    for (const s of r.segs) {
      let k = 0;
      for (let c = 0; c < cols.length; c++) if (s.x0 >= cols[c] - tol * 0.5) k = c;
      const t = cellMd(s.runs).replace(/\|/g, '\\|');
      cells[k] = cells[k] ? cells[k] + ' ' + t : t;
    }
    return cells;
  });
  const filled = grid.flat().filter(Boolean);
  const avgLen = filled.reduce((s, c) => s + c.length, 0) / Math.max(1, filled.length);
  if (filled.length / (grid.length * cols.length) < 0.5 || avgLen > 60) return null;
  const row = cells => '| ' + cells.map(c => c || ' ').join(' | ') + ' |';
  return [row(grid[0]), '| ' + cols.map(() => '---').join(' | ') + ' |', ...grid.slice(1).map(row)].join('\n');
}

/* ---------------- UI ---------------- */

const fmtSize = b => b < 1024 * 1024 ? (b / 1024).toFixed(0) + ' KB' : (b / 1024 / 1024).toFixed(1) + ' MB';
const current = () => activeId === 'sample' ? sample : files.find(f => f.id === activeId) || sample;
const STATUS = { queued: '대기', working: '변환 중', done: '완료', error: '실패' };

function renderList() {
  E.files.innerHTML = '';
  const list = files.length ? files : [sample];
  E.clear.hidden = !files.length;
  for (const f of list) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'file'; b.dataset.id = f.id;
    b.setAttribute('aria-current', String(f.id === activeId));
    const meta = f.sample ? '샘플 결과' : [fmtSize(f.size), f.pages ? f.pages + '쪽' : ''].filter(Boolean).join(' · ');
    const chipCls = f.sample ? 'sample' : f.status;
    b.innerHTML = `<span class="ficon" aria-hidden="true">PDF</span>
      <span style="min-width:0"><span class="fname"></span><span class="fmeta"></span>${f.status === 'working' || f.status === 'queued' ? '<span class="bar"><i></i></span>' : ''}</span>
      <span class="chip ${chipCls}">${f.sample ? '예시' : STATUS[f.status]}</span>`;
    b.querySelector('.fname').textContent = f.name;
    b.querySelector('.fmeta').textContent = meta;
    const bar = b.querySelector('.bar i'); if (bar) bar.style.width = (f.progress || 0) * 100 + '%';
    b.addEventListener('click', () => { activeId = f.id; renderList(); showActive(); });
    E.files.appendChild(b);
  }
}

function renderPreview(md) {
  if (typeof marked === 'undefined') { E.preview.textContent = md; return; }
  const html = marked.parse(md, { gfm: true, breaks: false });
  E.preview.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
  E.preview.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
}

function updateStats(f) {
  const md = f.md || '';
  const heads = (md.match(/^#{1,6} /gm) || []).length;
  const tables = (md.match(/^\| ?-{3}/gm) || []).length;
  const chars = md.replace(/\s/g, '').length;
  E.stats.textContent = f.status === 'done'
    ? `${f.pages}쪽 · 제목 ${heads}개 · 표 ${tables}개 · ${chars.toLocaleString('ko-KR')}자` : '';
}

function showActive() {
  const f = current();
  E.name.textContent = f.name;
  E.chip.className = 'chip ' + (f.sample ? 'sample' : f.status);
  E.chip.textContent = f.sample ? '예시' : STATUS[f.status];
  const working = f.status === 'working' || f.status === 'queued';
  E.busy.hidden = !working;
  if (working) setBusy(f);
  let banner = null, cls = '';
  if (f.sample) { banner = '아래는 예시 결과예요. PDF를 올리면 이 자리에 변환 결과가 나타나요.'; cls = 'sample'; }
  else if (f.status === 'error') { banner = f.error; cls = 'err'; }
  else if (f.warning) { banner = f.warning; cls = 'warn'; }
  E.banner.hidden = !banner;
  if (banner) { E.banner.textContent = banner; E.banner.className = 'banner ' + cls; }
  const md = f.status === 'done' ? f.md : '';
  if (E.src.value !== md) E.src.value = md;
  E.src.readOnly = f.status !== 'done';
  renderPreview(md);
  updateStats(f);
  E.copy.disabled = E.save.disabled = !md;
}

function setBusy(f) {
  E.busyText.textContent = f.status === 'queued' ? '차례를 기다리는 중…' : f.total ? `${f.total}쪽 중 ${f.done}쪽 읽는 중…` : 'PDF 여는 중…';
  E.busyBar.style.width = (f.progress || 0) * 100 + '%';
}

function explain(e) {
  if (e && e.name === 'PasswordException') return '암호가 걸린 PDF예요. 암호를 해제한 뒤 다시 올려 주세요.';
  if (e && e.name === 'InvalidPDFException') return 'PDF 파일을 읽을 수 없어요. 파일이 손상되지 않았는지 확인해 주세요.';
  return '변환하지 못했어요: ' + (e && e.message ? e.message : e);
}

async function processQueue() {
  if (busy) return;
  busy = true;
  let job;
  while ((job = files.find(f => f.status === 'queued'))) {
    job.status = 'working'; job.progress = 0; job.total = 0; job.done = 0;
    renderList(); if (job.id === activeId) showActive();
    try {
      if (!job.buf) job.buf = await job.file.arrayBuffer();
      const res = await convertPdf(job.buf, opts(), (d, t) => {
        job.done = d; job.total = t; job.progress = d / t;
        const bar = E.files.querySelector(`[data-id="${job.id}"] .bar i`); if (bar) bar.style.width = job.progress * 100 + '%';
        if (job.id === activeId) setBusy(job);
      });
      Object.assign(job, { status: 'done', md: res.md, pages: res.pages, warning: res.warning, error: null });
    } catch (e) {
      console.error(e);
      Object.assign(job, { status: 'error', error: explain(e), md: '' });
    }
    renderList(); if (job.id === activeId) showActive();
  }
  busy = false;
}

function addFiles(list) {
  const pdfs = [...list].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdfs.length < list.length) toast('PDF가 아닌 파일은 건너뛰었어요');
  if (!pdfs.length) return;
  const added = pdfs.map(file => ({ id: 'f' + (++seq), name: file.name, size: file.size, file, status: 'queued', progress: 0 }));
  files.push(...added);
  activeId = added[0].id;
  renderList(); showActive(); processQueue();
}

/* 이벤트 */
E.input.addEventListener('change', () => { addFiles(E.input.files); E.input.value = ''; });
let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dragDepth++; E.drop.classList.add('over'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) E.drop.classList.remove('over'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; E.drop.classList.remove('over'); if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

$('#opts').addEventListener('change', () => {
  const redo = files.filter(f => f.status === 'done' || f.status === 'error');
  if (!redo.length) return;
  redo.forEach(f => { f.status = 'queued'; f.progress = 0; f.warning = null; });
  renderList(); showActive(); processQueue();
  toast('바뀐 옵션으로 다시 변환해요');
});

E.clear.addEventListener('click', () => { if (busy) { toast('변환이 끝난 뒤에 지울 수 있어요'); return; } files = []; activeId = 'sample'; renderList(); showActive(); });

let t;
E.src.addEventListener('input', () => {
  const f = current(); f.md = E.src.value;
  clearTimeout(t); t = setTimeout(() => { renderPreview(f.md); updateStats(f); }, 150);
});

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
function setView(v) {
  E.panes.dataset.view = v;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  store.set('pdf2md-view', v);
}

E.copy.addEventListener('click', async () => {
  const md = E.src.value;
  try { await navigator.clipboard.writeText(md); }
  catch { E.src.select(); document.execCommand('copy'); E.src.setSelectionRange(0, 0); }
  toast('Markdown을 복사했어요');
});

// claude.ai에 게시된 페이지에서는 downloads 기능으로, 로컬에서 열면 일반 다운로드로 저장
const dlPromise = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(undefined);
dlPromise.then(dl => { if (dl === null) { E.save.hidden = true; } });

E.save.addEventListener('click', async () => {
  const f = current();
  const filename = f.name.replace(/\.pdf$/i, '') + '.md';
  const dl = await dlPromise;
  if (dl) {
    try { await dl.save({ filename, data: E.src.value }); toast(filename + ' 저장했어요'); }
    catch (e) {
      if (e?.code === 'declined') return;
      if (e?.code === 'rate_limited') toast('저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요');
      else toast('여기서는 저장할 수 없어요. 복사 버튼을 써 주세요');
    }
    return;
  }
  const blob = new Blob([E.src.value], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(a.download + ' 저장을 시작했어요');
});

let tt;
function toast(msg) { E.toast.textContent = msg; E.toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => E.toast.classList.remove('show'), 2200); }

const v = store.get('pdf2md-view');
if (v === 'md' || v === 'preview' || v === 'split') setView(v);
renderList(); showActive();
if (typeof pdfjsLib === 'undefined') toast('변환 엔진을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
})();
</script>
